services:
  kernel:
    build:
      context: .
      dockerfile: Dockerfile
    # The kernel's HTTP API binds 127.0.0.1 only (hardcoded, src/api/server.rs)
    # — never 0.0.0.0. host networking makes the container's loopback the
    # same as the host's, so 127.0.0.1:8080 works instead of needing a
    # bridge-network port publish (which a loopback-only bind can't reach).
    network_mode: host
    volumes:
      - veyron-run:/run/veyron
      - veyron-data:/var/lib/veyron
      - ./docker/config.yaml:/etc/veyron/config.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 15

  plugin:
    build:
      context: sdk/python
      dockerfile: ../../docker/plugin.Dockerfile
    depends_on:
      kernel:
        condition: service_healthy
    environment:
      VEYRON_SOCKET_PATH: /run/veyron/veyron.sock
    volumes:
      - veyron-run:/run/veyron
    # Socket file can lag a beat behind the /health 200 (health only proves
    # the HTTP gateway is up, not that the UDS listener has bound yet).
    restart: on-failure

volumes:
  veyron-run:
  veyron-data:
