[package]
name = "vynkor-fuzz"
version = "0.0.1"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
crc32fast = "1"

[dependencies.vynkor]
path = ".."

# the parent crate's [patch.crates-io] does not cross package boundaries;
# wire 0.0.3 isn't on crates.io yet, so pin both to the sibling checkouts
[patch.crates-io]
vynkor-wire = { path = "../../vynkor-wire" }
vynkor-sdk = { path = "../../vynkor-sdk" }

# Prevent this from interfering with the workspace
[workspace]

[[bin]]
name = "fuzz_frame_parse"
path = "fuzz_targets/fuzz_frame_parse.rs"
test = false
doc = false

[[bin]]
name = "fuzz_envelope_decode"
path = "fuzz_targets/fuzz_envelope_decode.rs"
test = false
doc = false

[[bin]]
name = "fuzz_router_pipeline"
path = "fuzz_targets/fuzz_router_pipeline.rs"
test = false
doc = false
