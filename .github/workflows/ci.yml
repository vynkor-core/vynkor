name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SDKs/wire live in sibling repos (not submodules — temporary decision,
      # see ROADMAP). Check them out beside the workspace so tests and the
      # proto drift check can reach their sources via ../veyron-* paths.
      - uses: actions/checkout@v4
        with:
          repository: veyron-core/veyron-wire
          path: ../veyron-wire
      - uses: actions/checkout@v4
        with:
          repository: veyron-core/veyron-sdk-cpp
          path: ../veyron-sdk-cpp
      - uses: actions/checkout@v4
        with:
          repository: veyron-core/veyron-sdk-python
          path: ../veyron-sdk-python

      - name: Proto drift check (T-17)
        run: |
          diff -u ../veyron-wire/proto/veyron_protocol.proto ../veyron-sdk-cpp/proto/veyron_protocol.proto
          diff -u ../veyron-wire/proto/veyron_protocol.proto ../veyron-sdk-python/proto/veyron_protocol.proto

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install C++ SDK build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler libprotobuf-dev libabsl-dev libssl-dev libzstd-dev libgtest-dev

      - name: "Build C++ SDK echo_plugin (T-02: real C++ binary for cpp integration test)"
        run: |
          cmake -B ../veyron-sdk-cpp/build -S ../veyron-sdk-cpp -DCMAKE_BUILD_TYPE=Release
          cmake --build ../veyron-sdk-cpp/build --target echo_plugin -j"$(nproc)"

      - name: Build
        run: cargo build --all --all-features

      - name: Unit + integration tests
        run: cargo test --all --all-features

      - name: Clippy
        run: cargo clippy --all -- -D warnings

      - name: Format check
        run: cargo fmt --check
