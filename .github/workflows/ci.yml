name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install C++ SDK build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler libprotobuf-dev libabsl-dev libssl-dev libzstd-dev libgtest-dev

      - name: Build C++ SDK echo_plugin (T-02: real C++ binary for cpp integration test)
        run: |
          cmake -B sdk/cpp/build -S sdk/cpp -DCMAKE_BUILD_TYPE=Release
          cmake --build sdk/cpp/build --target echo_plugin -j"$(nproc)"

      - name: Build
        run: cargo build --all --all-features

      - name: Unit + integration tests
        run: cargo test --all --all-features

      - name: Clippy
        run: cargo clippy --all -- -D warnings

      - name: Format check
        run: cargo fmt --check
