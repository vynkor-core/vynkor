# REL-01: tag-driven kernel releases — static musl binaries + SHA256SUMS.
#
# Usage:
#   bump [package] version in Cargo.toml, merge, then
#   git tag v0.1.4 && git push origin v0.1.4
#
# Assets (names carry no version, so install.sh can use
# /releases/latest/download/<asset> without an API call):
#   vyn-<target>.tar.gz   vyn, vyn-pair, licenses, README, config.example.yaml
#   SHA256SUMS            what install.sh verifies before installing
#   install.sh            the installer AS OF THIS TAG — the public one-liner
#                         resolves to releases/latest/download/install.sh, so
#                         curl|bash only ever runs reviewed, tagged code
# Each archive also gets a GitHub build-provenance attestation:
#   gh attestation verify vyn-x86_64-unknown-linux-musl.tar.gz -R vynkor-core/vynkor
#
# A tag with a pre-release suffix (v0.2.0-rc.1) publishes a pre-release,
# which /releases/latest skips.

name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  # dry run from any branch: builds + smoke-tests every target, publishes
  # nothing (check-version and publish only run for tags)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # release assets ship stripped (~22M -> a fraction); debug builds untouched
  CARGO_PROFILE_RELEASE_STRIP: symbols

jobs:
  check-version:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches Cargo.toml version
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "vynkor") | .version')"
          if [[ "$want" != "$have" ]]; then
            echo "::error::tag $GITHUB_REF_NAME != Cargo.toml version $have — bump Cargo.toml first"
            exit 1
          fi

  build:
    needs: check-version
    # tag push: gated on check-version; manual dry run: skipped, still build
    if: ${{ !cancelled() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped') }}
    strategy:
      # one arch failing must not hide the other's result
      fail-fast: false
      matrix:
        include:
          # native runners for both arches: no cross/qemu, and the C deps
          # (bundled sqlite, zstd, aws-lc) build with the stock musl-gcc
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install build deps
        # protoc: vynkor-wire runs prost-build in its build script
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends musl-tools protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --bin vyn --bin vyn-pair

      - name: Smoke test (static, runs)
        run: |
          bin="target/${{ matrix.target }}/release/vyn"
          file "$bin"
          file "$bin" | grep -q 'statically linked\|static-pie linked'
          "$bin" --version
          "target/${{ matrix.target }}/release/vyn-pair" --help > /dev/null

      - name: Package
        run: |
          name="vyn-${{ matrix.target }}"
          mkdir -p "pkg/$name"
          cp "target/${{ matrix.target }}/release/vyn" \
             "target/${{ matrix.target }}/release/vyn-pair" \
             LICENSE-MIT LICENSE-APACHE README.md "pkg/$name/"
          cp config.yaml "pkg/$name/config.example.yaml"
          # flat archive: install.sh extracts and installs by basename
          tar -C "pkg/$name" -czf "$name.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: vyn-${{ matrix.target }}
          path: vyn-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: install.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Stage installer
        run: install -m 0755 install.sh dist/install.sh

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum vyn-*.tar.gz install.sh > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/vyn-*.tar.gz
            dist/install.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "vynkor ${GITHUB_REF_NAME}" \
            --generate-notes \
            "${prerelease[@]}" \
            dist/vyn-*.tar.gz dist/install.sh dist/SHA256SUMS
