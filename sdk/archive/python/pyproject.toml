[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veyron-sdk"
version = "0.1.0"
description = "Veyron plugin SDK for Python"
requires-python = ">=3.9"
dependencies = [
    # pb2 regenerated with protoc 35.1 (gencode 7.35.1); runtime major must match.
    "protobuf>=7.35.1",
    # decompress FLAG_COMPRESSED frames (kernel zstd-compresses payloads >= 64 KiB)
    "zstandard>=0.22",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.50",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["veyron"]
