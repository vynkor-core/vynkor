# ai: LLM chat_completion, no permissions of its own — calls out through the
# `network` plugin above, so network must be running for ai to do anything.
id: ai
binary: /home/behzod/.local/lib/vyn/plugins/ai/ai
restart: on-failure
max_restarts: 5
sandbox: true
env:
  # Default-deny allowlist: names of env vars callers may reference via
  # api_key_env. No keys set on dev box; add real keys per provider.
  - AI_PLUGIN_ALLOWED_KEY_ENVS=ANTHROPIC_API_KEY,OPENAI_API_KEY,OLLAMA_API_KEY
  # Local Ollama model list is pulled automatically (startup + refresh_models).
  - AI_PLUGIN_DISCOVERY=[{"provider":"ollama","base_url":"http://localhost:11434","api_key_env":"OLLAMA_API_KEY"}]
  # A couple of hand-declared agents for the chat UI (model ids come from the
  # Ollama discovery above once the model is pulled).
  - AI_PLUGIN_AGENTS=[{"id":"default","name":"Assistant","model_id":"llama3.2","system_prompt":"You are a helpful assistant for a phone's device agent. Answer concisely.","goal":"Help the user","description":"General assistant","is_default":true},{"id":"code","name":"Coder","model_id":"qwen2.5-coder","system_prompt":"You are a code specialist. Write only code, no prose.","goal":"Write and explain code","description":"Code-focused assistant"}]
max_procs: 64
max_vmem_mb: 512
