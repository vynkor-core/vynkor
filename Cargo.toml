[package]
name = "vynkor"
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"

[[bin]]
name = "vyn"
path = "src/main.rs"

# K-05: standalone QR-rendering companion for `vyn device connect` (kernel CLI
# prints the plain pairing link/token only — see src/cli/device.rs). Lives in
# this crate (not a separate repo/plugin) for lowest blast radius. `qrcode` is
# referenced only from src/bin/vyn-pair.rs, not from the `vynkor` lib crate
# that `vyn` links, so it never ends up in the `vyn` binary despite being one
# shared [dependencies] table (single-crate project, no workspace split
# needed) — cargo only links crates a target's compiled code actually
# reaches, regardless of Cargo.toml being shared.
[[bin]]
name = "vyn-pair"
path = "src/bin/vyn-pair.rs"

[lib]
name = "vynkor"
path = "src/lib.rs"

[[test]]
name = "unit"
path = "tests/unit/mod.rs"

[[test]]
name = "integration"
path = "tests/integration/mod.rs"

[dependencies]
vynkor-wire = { version = "0.0.4", features = ["manifest"] }
tokio = { version = "1", features = ["full"] }

axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
tower-http = { version = "0.7.0", features = ["timeout"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = { version = "0.33", optional = true }
opentelemetry        = { version = "0.32", features = ["trace"], optional = true }
opentelemetry_sdk    = { version = "0.32", features = ["rt-tokio"], optional = true }
opentelemetry-otlp   = { version = "0.32", features = ["grpc-tonic"], optional = true }

serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

jsonwebtoken = "9"

rand = "0.8"

# extra features: sandbox shim (plugins/shim.rs) — pdeathsig (prctl module,
# gated by "process"), proc mount, readiness poll, socketpair
nix = { version = "0.31", features = ["signal", "process", "fs", "sched", "resource", "user", "mount", "poll", "socket"] }

# R9-03: filesystem isolation (plugins/fsaccess.rs) — Landlock LSM, linux-only
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
# R9-04: seccomp syscall filter (plugins/seccomp.rs) — pure-Rust BPF compiler,
# no system libseccomp dependency; libc for SYS_* constants
libc = "0.2"
seccompiler = "0.5"

clap = { version = "4.6", features = ["derive"] }
clap_complete = "4"

anyhow = "1"

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
semver = { version = "1.0", features = ["serde"] }
serde_json = "1"

prost = "0.13"

crc32fast = "1"
zstd = "0.13"
dashmap = "6"
governor = "0.8"

metrics = "0.23"
metrics-exporter-prometheus = "0.15"

rusqlite = { version = "0.40", features = ["bundled"] }

# D-06: bridge WS client (role: client) — the kernel connects outward to the
# host gateway like any SDK plugin
tokio-tungstenite = "0.24"
futures-util = "0.3"

# D-07: self-signed cert generation when TLS is on by default and the operator
# provided no tls_cert_path/tls_key_path
rustls = { version = "0.23", features = ["aws_lc_rs"] }
rcgen = "0.13"

# D-14/K-05: `vyn-pair` (src/bin/vyn-pair.rs) renders the pairing QR (terminal
# UTF-8 / SVG) — not used by the `vyn` lib/bin, see the vyn-pair [[bin]] above
qrcode = "0.14"
# base64url-encodes the pair payload for the vynkor://pair link (used by `vyn`)
base64 = "0.22"

# E-01: device credential store — AES-256-GCM at rest under a key derived from
# jwt_secret (HKDF); hkdf/sha2 declared directly, not via vynkor-wire
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
# E-01: deflate the pair payload so the QR stays scannable by the in-app
# scanner (the agent inflates via java.util.zip)
flate2 = "1"

[patch.crates-io]
# E-01: proto 1.7 / wire 0.0.4 — local until published to crates.io; drop this
# section once the release is out (see vynkor-wire README "Releasing").
# vynkor-sdk is patched too so dev-dependency tests see ONE wire crate (its
# 0.0.2 requirement resolves to the same local source).
vynkor-wire = { path = "../vynkor-wire" }
vynkor-sdk = { path = "../vynkor-sdk" }

[features]
otel = ["tracing-opentelemetry", "opentelemetry", "opentelemetry_sdk", "opentelemetry-otlp"]

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
clap_complete = "4"
crc32fast = "1"
vynkor-sdk = "0.0.3"
tower = "0.5"
mockito = "1"
tempfile = "3"
tracing-test = "0.2"
temp-env = "0.3.6"
