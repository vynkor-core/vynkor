[package]
name = "veyron"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "vyn"
path = "src/main.rs"

[lib]
name = "veyron"
path = "src/lib.rs"

[[test]]
name = "unit"
path = "tests/unit/mod.rs"

[[test]]
name = "integration"
path = "tests/integration/mod.rs"

[dependencies]
veyron-wire = { path = "wire", version = "0.1.0" }
tokio = { version = "1", features = ["full"] }

axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
tower-http = { version = "0.7.0", features = ["timeout"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = { version = "0.33", optional = true }
opentelemetry        = { version = "0.32", features = ["trace"], optional = true }
opentelemetry_sdk    = { version = "0.32", features = ["rt-tokio"], optional = true }
opentelemetry-otlp   = { version = "0.32", features = ["grpc-tonic"], optional = true }

serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

jsonwebtoken = "9"

hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"
rand = "0.8"

nix = { version = "0.31", features = ["signal", "process", "fs", "sched", "resource", "user"] }

clap = { version = "4.6", features = ["derive"] }
clap_complete = "4"

anyhow = "1"

reqwest = { version = "0.12", features = ["json"] }
semver = { version = "1.0", features = ["serde"] }
serde_json = "1"
zip = "2"
indicatif = "0.17"

prost = "0.13"

crc32fast = "1"
zstd = "0.13"
dashmap = "6"
governor = "0.8"

metrics = "0.23"
metrics-exporter-prometheus = "0.15"

rusqlite = { version = "0.40", features = ["bundled"] }

[features]
otel = ["tracing-opentelemetry", "opentelemetry", "opentelemetry_sdk", "opentelemetry-otlp"]

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
clap_complete = "4"
crc32fast = "1"
veyron-sdk = { path = "sdk/archive/rust" }
tower = "0.5"
tokio-tungstenite = "0.24"
futures-util = "0.3"
mockito = "1"
tempfile = "3"
tracing-test = "0.2"
temp-env = "0.3.6"
