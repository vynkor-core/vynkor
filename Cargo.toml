[package]
name = "veyron"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "vyn"
path = "src/main.rs"

[lib]
name = "veyron"
path = "src/lib.rs"

[[test]]
name = "unit"
path = "tests/unit/mod.rs"

[[test]]
name = "integration"
path = "tests/integration/mod.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }

axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.7.0", features = ["cors", "timeout"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

jsonwebtoken = "9"
chrono = "0.4"

hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"
rand = "0.8"

nix = { version = "0.28", features = ["signal", "process", "fs", "sched", "resource"] }

clap = { version = "4.6", features = ["derive"] }

anyhow = "1"

prost = "0.13"
prost-types = "0.13"

crc32fast = "1"
dashmap = "6"

metrics = "0.23"
metrics-exporter-prometheus = "0.15"

rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
crc32fast = "1"
veyron-sdk = { path = "sdk/rust" }
tower = "0.5"
tokio-tungstenite = "0.24"
futures-util = "0.3"

[build-dependencies]
prost-build = "0.13"
