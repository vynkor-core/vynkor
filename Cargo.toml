[package]
name = "veyron"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }

axum = "0.7"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

anyhow = "1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

jsonwebtoken = "9"
chrono = "0.4"

clap = { version = "4", features = ["derive"] }
tower-http = { version = "0.7.0", features = ["cors"] }
