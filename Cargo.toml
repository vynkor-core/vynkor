[package]
name = "veyron"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[[bin]]
name = "vyn"
path = "src/main.rs"

[lib]
name = "veyron"
path = "src/lib.rs"

[[test]]
name = "unit"
path = "tests/unit/mod.rs"

[[test]]
name = "integration"
path = "tests/integration/mod.rs"

[dependencies]
veyron-wire = "0.2.0"
tokio = { version = "1", features = ["full"] }

axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
tower-http = { version = "0.7.0", features = ["timeout"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = { version = "0.33", optional = true }
opentelemetry        = { version = "0.32", features = ["trace"], optional = true }
opentelemetry_sdk    = { version = "0.32", features = ["rt-tokio"], optional = true }
opentelemetry-otlp   = { version = "0.32", features = ["grpc-tonic"], optional = true }

serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

jsonwebtoken = "9"

hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"
rand = "0.8"
ed25519-dalek = "2"

# extra features: sandbox shim (plugins/shim.rs) — pdeathsig (prctl module,
# gated by "process"), proc mount, readiness poll, socketpair
nix = { version = "0.31", features = ["signal", "process", "fs", "sched", "resource", "user", "mount", "poll", "socket"] }

# R9-03: filesystem isolation (plugins/fsaccess.rs) — Landlock LSM, linux-only
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
# R9-04: seccomp syscall filter (plugins/seccomp.rs) — pure-Rust BPF compiler,
# no system libseccomp dependency; libc for SYS_* constants
libc = "0.2"
seccompiler = "0.5"

clap = { version = "4.6", features = ["derive"] }
clap_complete = "4"

anyhow = "1"

reqwest = { version = "0.12", features = ["json"] }
url = "2"
semver = { version = "1.0", features = ["serde"] }
serde_json = "1"
zip = "2"
indicatif = "0.17"

prost = "0.13"

crc32fast = "1"
zstd = "0.13"
dashmap = "6"
governor = "0.8"

metrics = "0.23"
metrics-exporter-prometheus = "0.15"

rusqlite = { version = "0.40", features = ["bundled"] }

[features]
otel = ["tracing-opentelemetry", "opentelemetry", "opentelemetry_sdk", "opentelemetry-otlp"]

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
clap_complete = "4"
crc32fast = "1"
veyron-sdk = "0.1.2"
tower = "0.5"
tokio-tungstenite = "0.24"
futures-util = "0.3"
mockito = "1"
tempfile = "3"
tracing-test = "0.2"
temp-env = "0.3.6"
