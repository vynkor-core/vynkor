port: 8000 # binary default (UX-3: keep in sync with config.rs default_port)
log_level: debug
# pid_file / log_file / data_dir default to a per-user private dir
# (XDG_RUNTIME_DIR, /run/user/<uid>, or ~/.veyron/run) — never the shared
# /tmp (AUDIT M-09, S2). Uncomment to override:
pid_file: /run/user/1000/veyron.pid
log_file: /run/user/1000/veyron.log
# data_dir: /path/to/events

# Authentication is required to start. For production, set a JWT secret:
#   jwt_secret: "<a long random secret>"
#
# This dev config opts out of auth instead. INSECURE: any local process can
# register as any plugin and reach the control plane. Do NOT use in production —
# set jwt_secret and remove allow_no_auth.
allow_no_auth: true

# Maximum concurrent UDS plugin connections (default: 1024).
# Connections beyond this limit are rejected immediately (peer sees EOF).
# max_connections: 1024

# Per-token HTTP API rate limiting (only active when jwt_secret is set).
# api_rate_limit_rps: 100    # sustained requests/second per JWT token
# api_rate_limit_burst: 20   # burst allowance on top of sustained rate; excess → 429

# Per-plugin IPC send rate limit. Exceeding returns ERR_RATE_LIMITED without disconnect.
# ipc_rate_limit_rps: 500    # messages per second per plugin connection; default: unlimited

# Per-(caller, provider) action quota (R6-03) — bounds one calling plugin from
# starving others via actions routed through a shared provider (e.g. `network`).
# Exceeding either returns ActionResponse{status: ACTION_QUOTA_EXCEEDED}.
# action_caller_rate_limit_rps: 50    # action requests/second per (caller, provider); default: unlimited
# action_caller_max_concurrent: 10    # simultaneous pending actions per (caller, provider); default: unlimited

# R6-04: idle timeout for an accepted long-lived streaming session (seconds
# since the last ActionRequestChunk/ActionResponseChunk in either direction).
# Past this, the kernel force-terminates the session with
# ActionStreamAbort{reason: "idle timeout"} to both sides. Default: unlimited.
# session_idle_timeout_secs: 300

# TLS for the WebSocket/HTTP gateway. ON by default (D-07): with no cert/key
# configured the kernel generates a self-signed pair on first start (stored
# under the private runtime dir; `vyn` pins it explicitly). Set `tls: false`
# to serve plain HTTP (insecure). To use your own certificate:
# tls: true
# tls_cert_path: /etc/veyron/tls/cert.pem
# tls_key_path:  /etc/veyron/tls/key.pem
#
# Audience required in every accepted JWT (D-07). When set, tokens without a
# matching `aud` claim are rejected — remint existing tokens with
# `vyn token mint`. `vyn token mint` defaults its `--aud` to this value.
# jwt_audience: myhub
#
# Explicit network bind address (D-07). Default: 0.0.0.0 when role: host and
# jwt_secret is set (remote devices can reach the gateway), else 127.0.0.1.
# bind: 0.0.0.0
#
# Seconds a JWT-authenticated WS connection may stay unregistered before the
# gateway drops it (D-07, closes the "never registers -> no frame-MAC" gap).
# ws_register_timeout_secs: 10
#
# Per-device JWT minting (offline, reads jwt_secret from this file):
#   vyn token mint --device phone-1 [--permissions PERMISSION_IPC_SEND] [--ttl-seconds 86400]

# Base dir for scratch/cache files: marketplace registry cache
# (~/.cache/veyron/registry.json when $HOME is set) and plugin-install
# staging. Defaults to the same per-user private dir as pid_file/log_file
# (XDG_RUNTIME_DIR, /run/user/<uid>, or ~/.veyron/run) — never the shared,
# world-writable /tmp (AUDIT M-09).
# tmp_dir: /run/user/1000

# Override the plugin registry URL (private/air-gapped registries).
# registry_url: https://registry.example.internal/registry.json
# Ed25519 public key (hex, 32 bytes) used to verify registry.json entry
# signatures. Only set this alongside a private registry_url signed by a
# different key — defaults to the built-in pinned maintainer key.
# marketplace_public_key: <64-char lowercase hex>
# How long the registry cache is considered fresh before `plugin list --refresh`
# re-fetches it (default: 3600 = 1h).
# registry_cache_ttl_secs: 3600

# Default action timeout (ms) when a plugin's ActionRequest.timeout_ms is 0.
# action_timeout_ms: 30000

# Exponential plugin restart backoff: base * 2^restart_count, capped at max.
# restart_backoff_base_ms: 100
# restart_backoff_max_ms: 30000

# Seconds to wait after SIGTERM before SIGKILL when a plugin doesn't set its
# own grace_seconds (see plugins[].grace_seconds above).
# default_grace_seconds: 5

# Event bus: max delivery attempts before an event is marked dead, and how
# long terminal (delivered/dead) events are kept before being pruned.
# event_max_retries: 5
# event_retention_secs: 3600

# Capacity of the kernel's inbound IPC message channel (backpressure bound).
# router_channel_capacity: 1024

# Fragment reassembly limits: how long an incomplete fragmented message is
# kept before being discarded, and the max concurrent reassembly streams
# per connection.
# fragment_timeout_secs: 30
# max_reassembly_streams: 64

# Consecutive protocol errors from one connection before it is throttled, and
# the cap on the per-connection error-budget map before idle entries prune.
# max_conn_errors: 16
# max_tracked_error_conns: 8192

# Seconds to wait for a WebSocket upgrade handshake before returning 408.
# ws_handshake_timeout_secs: 5

# Maximum concurrent WebSocket gateway connections. Excess upgrade requests
# are rejected with 503 before the handshake completes (T-09).
# max_ws_connections: 1024

# Plugin install/marketplace archive limits (zip-bomb protection, AUDIT M-06).
# max_archive_bytes: 268435456      # 256 MiB
# max_extracted_bytes: 1073741824   # 1 GiB
# max_archive_entries: 10000

# Plugin config lives in plugins.d/*.yaml (one file per plugin, R10-01) —
# not in this file. Default dir: <config dir>/plugins.d/. Override with:
# plugins_dir: /path/to/plugins.d
#
# Each file carries exactly one plugin entry, e.g.:
#
#   # plugins.d/my-plugin.yaml
#   id: my-plugin                    # unique plugin_id
#   binary: /abs/path/to/my-plugin   # absolute, or relative to the kernel's cwd
#   restart: on-failure              # always | on-failure | never
#   max_restarts: 5                  # max auto-restarts (default: 5)
#   args:                            # argv[1..] passed to the binary
#     - --socket
#     - /run/user/1000/veyron.sock  # use XDG_RUNTIME_DIR/veyron.sock (fallback: ~/.veyron/run/veyron.sock)
#   env:                             # extra environment variables
#     - LOG_LEVEL=info
#   (Every plugin also gets VEYRON_SOCKET_PATH and — when the kernel grants
#   it — VEYRON_DATA_DIR: a writable per-plugin dir <data_dir>/plugins/<id>
#   for the plugin's own persistent state, e.g. a database.)
#   sandbox: false                   # true: isolate in private user+net+PID+mount namespace (Linux) via a shim process (R9-02). Plugins run as PID 1 of their own namespace with a private /proc.
#   grace_seconds: 10                # optional, default 5 — seconds to wait after SIGTERM before SIGKILL
#   max_procs: 1024                  # optional, default 1024 — process-count cap (applied to every plugin, not just sandboxed). With cgroup v2 available the budget is the plugin's own cgroup pids.max: counts only that plugin's threads, isolated from the rest of the session (R9-01). Otherwise the fallback is RLIMIT_NPROC, which counts ALL threads of the real uid at clone time — on busy sessions (hundreds of threads) a low value makes every plugin thread spawn fail with EAGAIN, so raise it per-plugin there.
#   max_vmem_mb: 512                 # optional, default 512 — RLIMIT_AS cap in MiB (applied to every plugin, not just sandboxed)
#   max_fs_access: full              # optional, default full — Landlock filesystem ceiling for sandboxed plugins (R9-03). full: unrestricted; read-only: exec requirements + readonly_paths (read) + writable_paths (write); none: exec requirements + writable_paths only. Requires sandbox: true and Linux 5.13+.
#   readonly_paths:                  # optional — dirs/files the plugin may read (granted read+execute on dirs). Honored when max_fs_access: read-only.
#     - /usr/share/example
#   writable_paths:                  # optional — dirs/files the plugin may write/create. Honored when max_fs_access is read-only or none.
#     - /var/lib/veyron/plugins/my-plugin
#
# Duplicate plugin ids across drop-ins (or clashing with a legacy inline
# `plugins:` entry) fail the boot loudly. The legacy inline `plugins:` list
# still works but is deprecated — `vyn plugin install` now writes
# plugins.d/<slug>.yaml and `vyn plugin remove` deletes it; this file is no
# longer touched by install/remove.
#
# SIGHUP re-reads config.yaml and re-merges plugins.d/ (so parse errors and
# duplicate ids surface at reload), but the running plugin set is not
# respawned from the diff — apply plugin changes by restarting the kernel.

